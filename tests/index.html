<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookFlow QA Testing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #10b981;
      --error: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .back-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-val {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 4px;
    }
    .stat-val.passed { color: var(--primary); }
    .stat-val.failed { color: var(--error); }
    
    .test-suite-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .suite-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
    }
    .suite-title {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .suite-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .suite-badge.passed { background: rgba(16, 185, 129, 0.1); color: var(--primary); }
    .suite-badge.failed { background: rgba(239, 68, 68, 0.1); color: var(--error); }
    
    .test-case {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      gap: 12px;
    }
    .test-case:last-child {
      border-bottom: none;
    }
    .case-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .case-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .case-status {
      font-weight: 700;
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .case-status.passed { color: var(--primary); }
    .case-status.failed { color: var(--error); }
    
    .error-log {
      background-color: #000;
      color: #ff6b6b;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 0.8rem;
      white-space: pre-wrap;
      width: 100%;
    }
    
    .progress-bar-outer {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      height: 12px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-bar-inner {
      background: linear-gradient(90deg, var(--primary) 0%, #3b82f6 100%);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Hidden iframe hosting the core app DOM for integration / UI / A11y tests -->
  <iframe id="app-iframe" src="../index.html" style="position:absolute; width:1px; height:1px; top:-9999px;" title="App Sandbox"></iframe>

  <div class="container">
    <header role="banner">
      <div>
        <h1>CookFlow QA Test Runner</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Automated verification dashboard</p>
      </div>
      <a href="../index.html" class="back-link">&larr; Back to App</a>
    </header>

    <div class="progress-bar-outer" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Tests executing progress">
      <div id="test-progress" class="progress-bar-inner"></div>
    </div>

    <!-- Counters -->
    <div class="stats-bar">
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">TOTAL TESTS</div>
        <div id="total-count" class="stat-val">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--primary); font-size: 0.85rem; font-weight: 600;">PASSED</div>
        <div id="passed-count" class="stat-val passed">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--error); font-size: 0.85rem; font-weight: 600;">FAILED</div>
        <div id="failed-count" class="stat-val failed">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">DURATION</div>
        <div id="duration-val" class="stat-val">0ms</div>
      </div>
    </div>

    <!-- Output Dashboard list -->
    <main id="test-results-list" role="main">
      <!-- Populated dynamically by run_tests.js -->
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Initializing test suites...
      </div>
    </main>
  </div>

  <script type="module" src="run_tests.js"></script>
</body>
</html>
